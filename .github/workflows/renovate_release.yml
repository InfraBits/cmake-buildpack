name: Create Release For Renovate
on: { push: { branches: [ 'main' ] } }
jobs:
  renovate-release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.renovate-release.outputs.tag_name }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - id: renovate-release
        uses: infrabits/ci-create-renovate-release@2fc53eb4d5048f4375dc3fe7ec0f76d31d573d2c # v2.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  upload-buildpack:
    runs-on: ubuntu-latest
    needs: [renovate-release]
    if: needs.renovate-release.outputs.tag_name
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.renovate-release.outputs.tag_name }}

      - name: Package buildpack
        run: |
          tar -cvzf buildpack.tar.gz buildpack.toml bin/

      - name: Upload buildpack to release
        uses: infrabits/ci-create-missing-release@7c059cf25a4f9d88de32c74aca828bcf86ba78e5 # main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.renovate-release.outputs.tag_name }}
          artifacts: buildpack.tar.gz
