name: Create Release For Renovate
on: { push: { branches: [ 'main' ] } }
jobs:
  renovate-release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.renovate-release.outputs.tag_name }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - id: renovate-release
        uses: infrabits/ci-create-renovate-release@ee01aeac230f039e6788848a5e0185532bc036dc # v2.2.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  upload-buildpack:
    runs-on: ubuntu-latest
    needs: [renovate-release]
    if: needs.renovate-release.outputs.tag_name
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.renovate-release.outputs.tag_name }}

      - name: Package buildpack
        run: |
          tar -cvzf buildpack.tar.gz buildpack.toml bin/

      - name: Upload buildpack to release
        uses: infrabits/ci-create-missing-release@0307af8188d3843eccf3829f327db431c9dc0968 # main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.renovate-release.outputs.tag_name }}
          artifacts: buildpack.tar.gz
